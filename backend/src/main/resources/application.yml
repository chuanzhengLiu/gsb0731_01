spring:
  application:
    name: podcast-collab
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/podcast_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:podcastroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

server:
  port: 8080
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-dev-only-secret-key-min-32-bytes}
    access-token-ttl-seconds: 7200        # 2 hours
    refresh-token-ttl-seconds: 604800      # 7 days
  storage:
    # Local filesystem root for uploaded audio (dev). Production uses MinIO.
    root: ${STORAGE_ROOT:./data/storage}
  audio:
    max-size-bytes: 524288000              # 500MB
    allowed-extensions: wav,mp3,m4a
  media:
    # Secret used to sign short-lived audio streaming URLs
    url-signing-secret: ${MEDIA_URL_SECRET:dev-media-url-signing-secret-change-me}
    url-ttl-seconds: 3600
  rate-limit:
    general-per-minute: 100
    login-per-minute: 5
    upload-per-minute: 10
  frontend:
    # Base URL used to build invitation / password-reset links in emails
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost}
  invitation:
    ttl-seconds: 86400                     # 24 hours
  password-reset:
    ttl-seconds: 1800                      # 30 minutes
  transcription:
    # provider: openai | local | auto (openai when key present, else offline stub)
    provider: ${TRANSCRIPTION_PROVIDER:auto}
    # Key read from env only; never commit a real key. Empty => offline fallback.
    api-key: ${WHISPER_API_KEY:${OPENAI_API_KEY:}}
    api-base-url: ${WHISPER_API_BASE_URL:https://api.openai.com/v1}
    model: ${WHISPER_MODEL:whisper-1}
    language: ${WHISPER_LANGUAGE:zh}
  share:
    ttl-seconds: 604800                    # 访客分享链接 7 天有效

logging:
  level:
    org.flywaydb: info
