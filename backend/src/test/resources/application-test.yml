spring:
  datasource:
    url: jdbc:h2:mem:podcast_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long-1234567890
    access-token-ttl-seconds: 7200
    refresh-token-ttl-seconds: 604800
  storage:
    root: ./target/test-storage
  media:
    url-signing-secret: test-media-signing-secret
    url-ttl-seconds: 3600
  # Relax rate limits so the integration suite (many auth calls from one IP)
  # is not throttled; production limits live in application.yml.
  rate-limit:
    general-per-minute: 100000
    login-per-minute: 100000
    upload-per-minute: 100000
  # Force the offline transcription stub in tests (no network / API key).
  transcription:
    provider: local
    api-key: ""
