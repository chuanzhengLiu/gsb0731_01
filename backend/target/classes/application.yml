spring:
  application:
    name: podcast-collab-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    time-zone: UTC

server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-this-is-a-development-secret-key-0123456789}
    access-token-ttl: PT2H
    refresh-token-ttl: P7D
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/storage}
  security:
    require-https: false
  audio:
    max-versions: 10
  invite:
    ttl-hours: 24
  share:
    ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:podcast_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:podcastroot}
  jpa:
    show-sql: false
