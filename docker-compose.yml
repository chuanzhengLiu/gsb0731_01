services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: podcastroot
      MYSQL_DATABASE: podcast_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppodcastroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/podcast_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: podcastroot
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-this-is-a-dev-only-secret-key-min-32-bytes}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-dev-media-url-signing-secret-change-me}
      STORAGE_ROOT: /app/data/storage
    volumes:
      - audio_data:/app/data/storage
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  audio_data:
